[project]
name = "hca-entry-sheet-validator"
version = "0.1.0"
description = "Entry sheet validation Lambda service for HCA validation tools"
authors = [{ name = "Clever Canary", email = "dave@clevercanary.com" }]
requires-python = ">=3.12,<4.0"
dependencies = [
    "hca-validation-shared",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5,<9",
    "pytest-cov>=7,<8",
    # The container smoke test POSTs to the running Lambda over HTTP.
    "requests>=2.32.3,<3",
]

# Not a distributable package — this is a Lambda function, not a library.
# uv manages the environment and lockfile but builds no wheel.
[tool.uv]
package = false

# Deliberately no h5ad extra: the Lambda image must stay light (no h5py).
[tool.uv.sources]
hca-validation-shared = { path = "../../shared", editable = true }

# Coverage floor, enforced by CI's test matrix; how to measure and when to raise it: CLAUDE.md, Coverage (#548).
[tool.coverage.run]
source = ["src/entry_sheet_validator_lambda"]
# Also measure code the tests run in a child Python process (`python -c`).
patch = ["subprocess"]
branch = true
# The only test imports the handler in a child process, so the pytest process itself collects nothing.
disable_warnings = ["no-data-collected"]

[tool.coverage.report]
fail_under = 21
