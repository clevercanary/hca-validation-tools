[project]
name = "hca-schema-validator-service"
version = "0.1.0"
requires-python = "~=3.11"
dependencies = [
    "hca-schema-validator>=0.16.0,<0.17.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2,<9",
    "pytest-cov>=7,<8",
    "pyright>=1.1.408,<2",
]

# Not a distributable package — a subprocess validator built into the Batch image.
# Consumes the PUBLISHED hca-schema-validator wheel (its exact cellxgene pins),
# never a path dep. No exclude-newer (see #475 / cellxgene note).
[tool.uv]
package = false

# Coverage floor, enforced by CI's test matrix; how to measure and when to raise it: CLAUDE.md, Coverage (#548).
[tool.coverage.run]
source = ["src/hca_schema_validator_service"]
# Also measure code the tests run in a child Python process (`python -m`, a script by path).
patch = ["subprocess"]
branch = true

[tool.coverage.report]
fail_under = 95
