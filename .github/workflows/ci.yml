name: CI

# Phase 1 of #461: verify every PR with lint, typecheck and tests. This is a
# local workflow, not a caller of the shared clevercanary/.github reusable
# workflows (those don't exist yet — see #461); migrating to them is deferred.
#
# The entry-sheet-validator suite is intentionally excluded: its only test boots
# a built Docker image (`hca-entry-sheet-validator:latest`) and needs AWS creds
# (Lambda extension layer) plus a GOOGLE_SERVICE_ACCOUNT secret, so it can't run
# on a plain PR runner. Revisit as a separate gated job.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.9"
          python-version: "3.11"
          enable-cache: true
      # Ruff pinned to match .pre-commit-config.yaml (rev v0.11.8) so local and
      # CI agree. Config lives in ruff.toml (select = E/F/I/W; widening tracked
      # in #467).
      - name: Ruff lint
        run: uvx ruff@0.11.8 check .
      - name: Ruff format check
        run: uvx ruff@0.11.8 format --check .
      # Each service commits its uv.lock (#483), and the test matrix's `uv sync --frozen`
      # installs it without checking it against pyproject.toml, so fail on a stale one
      # here (#823). uv's error doesn't name the lock, so the step does.
      - name: Service locks are current
        run: |
          failed=0
          for lock in services/*/uv.lock; do
            if ! uv lock --check --directory "$(dirname "$lock")"; then
              echo "::error file=$lock::uv lock --check failed for $lock; if it is stale, run 'uv lock' in its directory and commit it."
              failed=1
            fi
          done
          exit $failed

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.9"
          python-version: "3.11"
          enable-cache: true
      - name: Typecheck (pyright)
        run: make typecheck

  # The Pydantic models and the data dictionary are generated from the LinkML YAML and committed. Regenerate
  # both and fail if anything differs, so a YAML edit without `make gen-schema` cannot merge (#350). The
  # opt-in pre-commit hook `schema-generated` runs the same command at commit time.
  generated-schema:
    name: generated schema files are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.9"
          python-version: "3.11"
          enable-cache: true
      - name: Regenerate the models and the data dictionary
        run: make -C shared gen-schema generate-data-dictionary
      - name: Fail if they changed
        run: |
          changed=$(git status --porcelain -- packages/hca-metadata-schema data_dictionaries)
          if [ -n "$changed" ]; then
            echo "$changed"
            git diff -- packages/hca-metadata-schema data_dictionaries
            echo "::error::Generated schema files are stale. Run 'make -C shared gen-schema generate-data-dictionary' and commit the result."
            exit 1
          fi

  schema-lint:
    # Two checks, each catching what the other misses (#546). linkml lint does not resolve references, so a class naming
    # an unknown slot passes it; validate-schema catches that, and names the file, line and cause. The linter sees
    # metamodel violations LinkML coerces at load time (a string where a list belongs). Lint errors fail; warnings are
    # printed, not enforced.
    name: schema validate and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.9"
          python-version: "3.11"
          enable-cache: true
      - name: Validate that each schema file loads
        run: make -C packages/hca-metadata-schema validate-schema
      - name: Lint the LinkML schema
        run: make -C packages/hca-metadata-schema lint-schema-errors

  test:
    name: test (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `sync-args` is `--frozen` only where a uv.lock is committed. The
          # services commit their lock, so CI installs exactly what's locked;
          # `--frozen` doesn't check it, so the lint job does. shared/ and
          # packages/* gitignore their lock (#483), so there's nothing to
          # freeze — plain `uv sync` re-resolves.
          #
          # shared has an `integration` marker for tests needing live creds;
          # PR CI runs only the hermetic subset.
          - project: shared
            sync-args: ''
            pytest-args: '-m "not integration"'
          # The published packages — untested by `make test-all`, so this is
          # net-new coverage of our PyPI artifacts.
          - project: packages/hca-metadata-schema
            sync-args: ''
            pytest-args: ''
          - project: packages/hca-anndata-tools
            sync-args: ''
            pytest-args: ''
          - project: packages/hca-anndata-mcp
            sync-args: ''
            pytest-args: ''
          # `cov-vendored`: shown in the job summary with no floor; see this project's [tool.coverage.report] omit.
          - project: packages/hca-schema-validator
            sync-args: ''
            pytest-args: ''
            cov-vendored: '*/_vendored/*'
          # The tracker packages need aria2c for their download tests, which
          # skip without it.
          - project: packages/hca-tracker-client
            sync-args: ''
            pytest-args: ''
            apt: aria2
          - project: packages/hca-tracker-mcp
            sync-args: ''
            pytest-args: ''
            apt: aria2
          - project: services/dataset-validator
            sync-args: '--frozen'
            pytest-args: ''
          - project: services/cellxgene-validator
            sync-args: '--frozen'
            pytest-args: ''
          - project: services/hca-schema-validator
            sync-args: '--frozen'
            pytest-args: ''
          # The container smoke test boots the built image; `make test-lambda-container` runs it.
          - project: services/entry-sheet-validator
            sync-args: '--frozen'
            pytest-args: '--ignore=tests/test_lambda_container_smoke.py'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.9"
          python-version: "3.11"
          enable-cache: true
      - name: Install system packages
        if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - name: Sync dependencies
        run: uv sync ${{ matrix.sync-args }}
        working-directory: ${{ matrix.project }}
      # --cov measures the project's own package (`[tool.coverage.run] source` in its pyproject.toml), and
      # pytest-cov fails the run below that file's `[tool.coverage.report] fail_under` (#548).
      - name: Run tests
        run: uv run pytest tests/ ${{ matrix.pytest-args }} -v --cov --cov-report=
        working-directory: ${{ matrix.project }}
      # Runs after a failed test step too, so a run that misses its floor still shows which files fell.
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          [ -f .coverage ] || exit 0  # the test step failed before pytest measured anything
          {
            echo "### Coverage: ${{ matrix.project }}"
            echo
            uv run coverage report --format=markdown --precision=2 --fail-under=0
            if [ -n "${{ matrix.cov-vendored }}" ]; then
              echo
              echo "#### Vendored code (no floor)"
              echo
              # The project config omits this code. A non-empty --omit replaces that list, so one matching nothing
              # brings it back; --fail-under=0 because the project's floor is for its own code.
              uv run coverage report --include='${{ matrix.cov-vendored }}' --omit='__none__' --fail-under=0 --format=markdown --precision=2
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: ${{ matrix.project }}
