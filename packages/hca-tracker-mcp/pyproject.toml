[project]
name = "hca-tracker-mcp"
version = "0.2.0"
description = "MCP server to list and download atlas files from the HCA Atlas Tracker"
authors = [{ name = "Clever Canary", email = "dave@clevercanary.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<4.0"
# Not published to PyPI (see "Private packages" in CLAUDE.md). The sibling
# bound is the wheel's metadata: git and path installs take hca-tracker-client
# from the same commit through [tool.uv.sources] below, so it only constrains a
# client installed separately. Its upper bound is the next minor, because at
# 0.x a minor bump signals a breaking change.
dependencies = [
    "anyio>=4,<5",
    "fastmcp>=2,<3",
    "pydantic>=2,<3",
    "hca-tracker-client>=0.2,<0.3",
]

[project.urls]
Homepage = "https://github.com/clevercanary/hca-validation-tools"

[project.scripts]
hca-tracker-mcp = "hca_tracker_mcp.main:run"

# Resolves the sibling from the same checkout or git commit: in development, and
# for `uvx --from git+…#subdirectory=packages/hca-tracker-mcp` and
# `uv tool install <path>` installs.
[tool.uv.sources]
hca-tracker-client = { path = "../hca-tracker-client", editable = true }

[dependency-groups]
dev = ["pytest>=8.0,<9", "pytest-asyncio>=0.23", "pyright>=1.1.408,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hca_tracker_mcp"]
