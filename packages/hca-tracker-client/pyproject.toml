[project]
name = "hca-tracker-client"
version = "0.2.0"
description = "Find, download and report on atlas files from the HCA Atlas Tracker"
authors = [{ name = "Clever Canary", email = "dave@clevercanary.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<4.0"
# No runtime dependencies: the tracker API is plain JSON over urllib, aria2 is
# driven over its XML-RPC interface with xmlrpc.client, and the aria2c binary
# itself is a system package (see README).
dependencies = []

[project.urls]
Homepage = "https://github.com/clevercanary/hca-validation-tools"

[dependency-groups]
dev = ["pytest>=8.0,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hca_tracker_client"]
