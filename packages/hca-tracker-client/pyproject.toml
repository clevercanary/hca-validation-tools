[project]
name = "hca-tracker-client"
version = "0.3.0"
description = "Find, download and report on atlas files from the HCA Atlas Tracker"
authors = [{ name = "Clever Canary", email = "dave@clevercanary.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<4.0"
# No runtime dependencies: the tracker API is plain JSON over urllib, aria2 is
# driven over its XML-RPC interface with xmlrpc.client, and the aria2c binary
# itself is a system package (see README).
dependencies = []

# Uploads drive hca-smart-sync's engine, which brings boto3, rich, typer and
# pydantic-settings; the base package stays dependency-free without the extra.
# Pinned to one minor: SmartSync.sync(), its return dict, ATLAS_BIONETWORKS and
# FileType are module-level names in a CLI package, not a declared API
# (tests/test_uploads.py::test_smart_sync_import_contract pins what is used).
[project.optional-dependencies]
upload = ["hca-smart-sync==0.4.*"]

[project.urls]
Homepage = "https://github.com/clevercanary/hca-validation-tools"

[dependency-groups]
dev = ["pytest>=8.0,<9", "hca-smart-sync==0.4.*"]

[tool.pytest.ini_options]
filterwarnings = [
    # typer 0.16 (a dependency of hca-smart-sync) imports two click helpers click 8.2 deprecates; not ours to fix.
    "ignore:'click.utils.get_(binary|text)_stream' is deprecated:DeprecationWarning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hca_tracker_client"]
