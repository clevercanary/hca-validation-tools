[project]
name = "hca-anndata-tools"
version = "0.7.1"
description = "Library for inspection, summarization, and statistics of AnnData h5ad files"
authors = [{ name = "Clever Canary", email = "dave@clevercanary.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    # >=0.11: anndata.io (write_elem) does not exist in 0.10.x, and _io
    # imports it, so a 0.10 resolution fails to import the whole package.
    # Capped below 0.12 so CI — which resolves fresh (package locks are
    # gitignored, #483) — tests the writer the contract's profile is defined
    # against: anndata 0.12 serializes some encodings differently (e.g.
    # Categorical-of-StringDtype categories come out plain, not nullable).
    # Moves when cellxgene-schema's own anndata pin moves.
    "anndata>=0.11,<0.12",
    # Same cap cellxgene-schema carries, for the same reason: scipy 1.16
    # removed sparse internals anndata 0.11's backed classes use — a backed
    # X slice raises "'backed_csr_matrix' object has no attribute
    # '_validate_indices'" (caught by CI's fresh resolve, reproduced with
    # anndata 0.11.4 + scipy 1.17.1). Moves with the anndata cap above.
    "scipy<1.16",
    "pandas>2,<3",
    "numpy<3",
    "h5py>=3.8",
    "scanpy>=1.10",
    "matplotlib>=3.7",
    "pydantic>=2,<3",
]

[project.urls]
Homepage = "https://github.com/clevercanary/hca-validation-tools"

[dependency-groups]
dev = ["pytest>=8.0,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Ships every file under the package directory, which is how the bundled
# reference_data/*.csv.gz gene tables reach the wheel.
[tool.hatch.build.targets.wheel]
packages = ["src/hca_anndata_tools"]
