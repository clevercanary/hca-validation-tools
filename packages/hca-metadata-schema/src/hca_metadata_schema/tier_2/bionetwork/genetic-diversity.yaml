id: https://github.com/clevercanary/hca-validation-tools/schema/tier_2/bionetwork/genetic-diversity
name: hca-validation-tier-2-genetic-diversity
title: Genetic Diversity BioNetwork Tier 2 Extensions
description: Genetic Diversity network Tier 2 donor metadata, collected under managed access
license: MIT

prefixes:
