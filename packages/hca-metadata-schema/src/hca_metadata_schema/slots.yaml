id: https://github.com/clevercanary/hca-validation-tools/schema/slots
name: hca-validation-slots
title: Shared Slot Definitions for HCA Validation Tools
description: Reusable slots employed across multiple HCA validation schemas
license: MIT

prefixes:
  linkml: https://w3id.org/linkml/
  hca: https://github.com/clevercanary/hca-validation-tools/schema/

default_prefix: hca
default_range: string

imports:
  - linkml:types
  - ./enums
  - ./dataset
  - ./donor
  - ./sample

types:
  Email:
    typeof: string
    pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'

slots:
  ambient_count_correction:
    title: Ambient Count Correction
    description: Software used to correct ambient RNA counts, or 'none'.
    range: string
    required: true
    examples:
      - value: "none"
      - value: "soupx"
      - value: "cellbender"
    annotations:
      annDataLocation: obs

  doublet_detection:
    title: Doublet Detection
    description: Was doublet detection software used during CELLxGENE processing? If so, which software?
    range: string
    required: true
    examples:
      - value: "none"
      - value: "doublet_finder"
      - value: "manual"
    annotations:
      annDataLocation: obs

  dataset_id:
    title: Dataset ID
    description: A unique identifier for each dataset in the study. This should be unique to the study.
    range: Dataset
    inlined: false
    required: true

  sample_id:
    title: Sample ID
    description: >-
      Identification number of the sample. This is the fundamental unit of sampling the tissue (the specimen taken from the subject), which can be the same as the 'subject_ID', but is often different if multiple samples are taken from the same subject. Note: this is NOT a unit of multiplexing of donor samples, which should be stored in "library".
    examples:
      - value: SC24
      - value: SC25
      - value: SC28
    annotations:
      annDataLocation: obs
      tier: Tier 1
    range: Sample
    inlined: false
    required: true
    comments:
      - Fundamental unit of sampling of the tissue.

  donor_id:
    title: Donor ID
    description: >-
      This must be free-text that identifies a unique individual that data were derived from.
    examples:
      - value: CR_donor_1
      - value: MM_donor_1
      - value: LR_donor_2
    annotations:
      annDataLocation: obs
      tier: Tier 1
      cxg: donor_id
    range: Donor
    inlined: false
    required: true
    comments:
      - Fundamental unit of biological variation of the data.
    notes:
      - >-
        It is strongly recommended that this identifier be designed so that it is unique to: a given individual within the collection of datasets that includes this dataset, and a given individual across all collections in CELLxGENE Discover. It is strongly recommended that "pooled" be used for observations from a sample of multiple individuals that were not confidently assigned to a single individual through demultiplexing. It is strongly recommended that "unknown" ONLY be used for observations in a dataset when it is not known which observations are from the same individual.

  radial_tissue_term:
    title: Radial Tissue Term
    description: The layer of the gut that was sequenced. This depends on the chemical digestion used.
    examples:
      - value: EPI
      - value: LP
      - value: MUSC
      - value: SUB
      - value: MLN
      - value: Peyers patch
    annotations:
      annDataLocation: obs
      tier: Tier 1
    range: RadialTissueTerm
    required: true

  dissociation_protocol:
    title: Dissociation Protocol
    description: Dissociation chemicals used during sample preparation.
    annotations:
      annDataLocation: obs
      tier: Tier 1
    range: string
    required: true
    examples:
      - value: trypsin
      - value: trypLE
      - value: collagenase

  deprecated_slot:
    title: Deprecated Slot
    description: Placeholder string slot that can be extended (via is_a) for deprecated or transitional metadata fields.
    range: string
    required: false
    multivalued: false
