id: https://github.com/clevercanary/hca-validation-tools/schema/sample
name: hca-validation-sample
title: HCA Validation Sample Schema
description: Schema for validating Human Cell Atlas (HCA) sample metadata
license: MIT

prefixes:
  linkml: https://w3id.org/linkml/
  hca: https://github.com/clevercanary/hca-validation-tools/schema/

default_prefix: hca
default_range: string

imports:
  - linkml:types
  - ./slots

classes:
  Sample:
    description: >-
      A biological sample derived from a donor or another sample
    slots:
      - sample_id
      - donor_id
      - dataset_id
      - author_batch_notes
      - age_range
      - cell_number_loaded
      - cell_viability_percentage
      - cell_enrichment
      - development_stage_ontology_term_id
      - disease_ontology_term_id
      - disease_ontology_term
      - institute
      - is_primary_data
      - library_id
      - library_id_repository
      - library_preparation_batch
      - library_sequencing_run
      - sample_collection_method
      - sample_collection_year
      - sample_collection_site
      - sample_collection_relative_time_point
      - tissue_free_text
      - tissue_type
      - tissue_ontology_term_id
      - suspension_type
      - sampled_site_condition
      - sample_preservation_method
      - sample_source
      - tissue_ontology_term
    slot_usage:
      sample_id:
        range: string
        identifier: true
        # Annotations are duplicated here to get around an apparent bug in inheriting them (https://github.com/linkml/linkml/issues/2805)
        annotations:
          annDataLocation: obs
          tier: Tier 1

slots:
  author_batch_notes:
    title: Author Batch Notes
    description: >-
      Encoding of author knowledge on any further information related to likely batch effects.
    examples:
      - value: Batch run by different personnel on different days
    annotations:
      annDataLocation: obs
      tier: Tier 1
    range: string
    required: false
    multivalued: false
    comments:
      - >-
        Space for author intuition of batch effects in their dataset.

  age_range:
    is_a: deprecated_slot
    title: Age Range
    description: Deprecated placeholder for age range metadata.
    annotations:
      annDataLocation: obs

  cell_number_loaded:
    title: Cell Number Loaded
    description: >-
      Estimated number of cells loaded for library construction.
    examples:
      - value: "5000"
      - value: "4000"
    annotations:
      annDataLocation: obs
      tier: Tier 1
    range: integer
    required: false
    multivalued: false
    comments:
      - >-
        Can explain the number of doublets found in samples.

  cell_viability_percentage:
    title: Cell Viability Percentage
    description: >-
      If measured, per sample cell viability before library preparation (as a percentage).
    examples:
      - value: "88"
      - value: "95"
      - value: "93.5"
      - value: unknown
    annotations:
      annDataLocation: obs
      tier: Tier 1
    any_of:
      - range: decimal
      - range: string
    required: false
    multivalued: false
    comments:
      - >-
        Is a measure of sample quality that could be used to explain outlier samples.

  cell_enrichment:
    title: Cell Enrichment
    description: Specifies the cell types targeted for enrichment or depletion beyond the selection of live cells.
    examples:
      - value: CL:0000057+
      - value: na
    annotations:
      annDataLocation: obs
      tier: Tier 1
    range: string
    required: true
    multivalued: false
    notes:
      - "This must be a Cell Ontology (CL) term (http://www.ebi.ac.uk/ols4/ontologies/cl). For cells that are enriched, list the CL code followed by a \"+\". For cells that were depleted, list the CL code followed by a \"-\". If no enrichment or depletion occurred, please use 'na' (not applicable)"
    comments:
      - If cell lineages were filtered, this may be a dataset exclusion criterion.

  institute:
    title: Institute
    description: >-
      Institution where the samples were processed.
    examples:
      - value: EMBL-EBI
      - value: Genome Institute of Singapore
    annotations:
      annDataLocation: obs
      tier: Tier 1
    range: string
    required: true
    multivalued: false
    comments:
      - >-
        To be able to link to other studies from the same institution as sometimes samples from different labs in the same institute are processed via similar core facilities. Thus batch effects may be smaller for datasets from the same institute even if other factors differ.

  is_primary_data:
    is_a: deprecated_slot
    title: Is Primary Data
    description: >-
      This must be "true" if this is the canonical instance of this cellular observation and "false" if not. This
      is commonly "false" for meta-analyses reusing data or for secondary views of data.
    examples:
      - value: "true"
      - value: "false"
    annotations:
      annDataLocation: obs
      tier: Tier 1
      cxg: is_primary_data
    # Kept as a deprecated placeholder on purpose. The annotation is the only thing added here, because
    # annotations are inert for validation: they tell annDataLocation-walking consumers such as drop_obs_columns
    # that this obs column exists and must not be deleted, without altering what the entry sheet validator
    # accepts. Restoring it to a real `range: boolean` slot would start type-checking the column on entry
    # sheets, where it is currently an unconstrained string that tolerates any value including "na" — sheets
    # that validate today would begin failing. See #544.
    # The description is CELLxGENE's per-observation definition, published for submitters; the slot itself stays an
    # unconstrained string. The real modelling question is deferred, not answered: CELLxGENE defines this in obs as
    # a per-cell bool, while Tier 1 files it under `sample`. A sample's cells can legitimately disagree, so Sample
    # is the wrong grain for it. Moving it to Cell is its own change: slots are global by name in LinkML, so it
    # needs a slot_usage override rather than a move, and removing it from Sample outright would make sheets
    # carrying the column fail with extra_forbidden.
    comments:
      - This helps to ensure samples are not used twice.
    notes:
      - "true; false"

  library_id:
    title: Library ID
    description: >-
      The unique ID that is used to track libraries in the investigator's institution (should align with the publication).
    examples:
      - value: A24
      - value: NK_healthy_001
    annotations:
      annDataLocation: obs
      tier: Tier 1
    range: string
    required: true
    multivalued: false
    comments:
      - >-
        A way to track the unit of data generation. This should include sample pooling.

  library_id_repository:
    title: Library ID Repository
    description: >-
      The unique ID used to track libraries from one of the following public data repositories: EGAX*, GSM*, SRX*, ERX*, DRX, HRX, CRX.
    examples:
      - value: GSM1684095
    annotations:
      annDataLocation: obs
      tier: Tier 1
    range: string
    required: false
    multivalued: false
    comments:
      - >-
        Links a dataset back to the source from which it was ingested, optional only if this is the same as the library_id.

  library_preparation_batch:
    title: Library Preparation Batch
    description: >-
      Indicating which samples' libraries were prepared in the same chip/plate/etc., e.g. batch1, batch2.
    examples:
      - value: batch01
      - value: batch02
    annotations:
      annDataLocation: obs
      tier: Tier 1
    range: string
    required: false
    recommended: true
    multivalued: false
    comments:
      - >-
        Sample preparation is a major source of batch effects.

  library_sequencing_run:
    title: Library Sequencing Run
    description: >-
      The identifier (or accession number) that indicates which samples' libraries were sequenced in the same run.
    examples:
      - value: run1
      - value: NV0087
    annotations:
      annDataLocation: obs
      tier: Tier 1
    range: string
    required: false
    recommended: true
    multivalued: false
    comments:
      - >-
        Library sequencing is a major source of batch effects.

  sample_collection_year:
    title: Sample Collection Year
    description: >-
      Year of sample collection. Should not be detailed further (to exact month and day), to prevent identifiability.
    examples:
      - value: "2018"
    annotations:
      annDataLocation: obs
      tier: Tier 1
    range: string
    required: false
    multivalued: false
    comments:
      - >-
        May explain whether a dataset was separated into smaller batches.

  sample_collection_site:
    title: Sample Collection Site
    description: >-
      The pseudonymised name of the site where the sample was collected.
    examples:
      - value: AIDA_site_1
      - value: AIDA_site_2
    annotations:
      annDataLocation: obs
      tier: Tier 1
    range: string
    required: false
    multivalued: false
    comments:
      - To understand whether the collection site contributes to batch effects.
    notes:
      - >-
        It is strongly recommended that this identifier be designed so that it is unique to a given site within the collection of datasets that includes this site (for example, the labels 'site1', 'site2' may appear in other datasets thus rendering them indistinguishable).

  sample_collection_relative_time_point:
    title: Sample Collection Relative Time Point
    description: >-
      Time point when the sample was collected. This field is only needed if multiple samples from the same subject are available and collected at different time points. Sample collection dates (e.g. 23/09/22) cannot be used due to patient data protection, only relative time points should be used here (e.g. day3).
    examples:
      - value: sampleX_day1
    annotations:
      annDataLocation: obs
      tier: Tier 1
    range: string
    required: false
    multivalued: false
    comments:
      - >-
        Explains variability in the data between samples from the same subject.

  tissue_free_text:
    title: Tissue Free Text
    description: >-
      The detailed anatomical location of the sample - this does not have to tie to an ontology term.
    examples:
      - value: terminal ileum
    annotations:
      annDataLocation: obs
      tier: Tier 1
    range: string
    required: false
    multivalued: false
    comments:
      - >-
        To help the integration team understand the anatomical location of the sample, specifically to solve the problem when the UBERON ontology terms are insufficiently precise.

  tissue_type:
    title: Tissue Type
    description: Whether the tissue is "tissue", "organoid", or "cell culture".
    examples:
      - value: tissue
      - value: organoid
      - value: cell culture
    annotations:
      annDataLocation: obs
      cxg: tissue_type
      tier: Tier 1
    range: TissueType
    required: true
    multivalued: false
    comments:
      - Source of batch effect & dataset exclusion criteria.

  tissue_ontology_term_id:
    title: Tissue Ontology Term ID
    description: The detailed anatomical location of the sample, please provide a specific UBERON term.
    range: string
    required: true
    examples:
      - value: "UBERON:0001828"
      - value: "UBERON:0000966"
    notes:
      - |-
        If tissue_type is "tissue" or "organoid", this must be the most accurate child of UBERON:0001062 for anatomical entity. If tissue_type is "cell culture" this must follow the requirements for cell_type_ontology_term_id.
    comments:
      - Major biological effect that needs to be assessed for sufficient coverage in the atlas datasets.
    annotations:
      annDataLocation: obs
      cxg: tissue_ontology_term_id
      tier: Tier 1

  suspension_type:
    title: Suspension Type
    description: Specifies whether the sample contains single cells or single nuclei data.
    examples:
      - value: cell
      - value: nucleus
      - value: na
    annotations:
      annDataLocation: obs
      cxg: suspension_type
      tier: Tier 1
    range: SuspensionType
    required: true
    multivalued: false
    notes:
      - |-
        This must be "cell", "nucleus", or "na".
        This must be the correct type for the corresponding assay:
        * 10x transcription profiling [EFO:0030080] and its children = "cell" or "nucleus"
        * ATAC-seq [EFO:0007045] and its children = "nucleus"
        * BD Rhapsody Whole Transcriptome Analysis [EFO:0700003] = "cell"
        * BD Rhapsody Targeted mRNA [EFO:0700004] = "cell"
        * CEL-seq2 [EFO:0010010] = "cell" or "nucleus"
        * CITE-seq [EFO:0009294] and its children = "cell"
        * DroNc-seq [EFO:0008720] = "nucleus"
        * Drop-seq [EFO:0008722] = "cell" or "nucleus"
        * GEXSCOPE technology [EFO:0700011] = "cell" or "nucleus"
        * inDrop [EFO:0008780] = "cell" or "nucleus"
    comments:
      - Major source of batch effect & dataset exclusion criteria.

  sampled_site_condition:
    title: Sampled Site Condition
    description: Whether the site is considered healthy, diseased or adjacent to disease.
    examples:
      - value: healthy
      - value: diseased
      - value: adjacent
    annotations:
      annDataLocation: obs
      tier: Tier 1
    range: SampledSiteCondition
    required: true
    multivalued: false
    comments:
      - Main contributor to batch effects.

  sample_preservation_method:
    title: Sample Preservation Method
    description: Indicating if tissue was frozen, or not, at any point before library preparation.
    examples:
      - value: fresh
      - value: frozen at -70C
    annotations:
      annDataLocation: obs
      tier: Tier 1
    range: SamplePreservationMethod
    required: true
    multivalued: false
    comments:
      - Main contributor to batch effects.

  sample_source:
    title: Sample Source
    description: >-
      The study subgroup that the participant belongs to. This indicates whether the participant was a surgical donor
      (this includes patients providing blood samples or biopsies), a postmortem donor, or a living organ donor.
    examples:
      - value: surgical donor
      - value: postmortem donor
    annotations:
      annDataLocation: obs
      tier: Tier 1
    range: SampleSource
    required: true
    multivalued: false
    comments:
      - >-
        The source of the sample (whether the sample comes from a surgical donor, a postmortem donor or a living organ donor)
        can result in different cellular profiles and hence batch effects.

  development_stage_ontology_term_id:
    title: Development Stage Ontology Term ID
    description: Age of the subject.
    examples:
      - value: HsapDv:0000237
      - value: unknown
    annotations:
      annDataLocation: obs
      cxg: development_stage_ontology_term_id
      tier: Tier 1
    range: DevelopmentStage
    required: true
    multivalued: false
    notes:
      - |-
        If organism_ontology_term_id is "NCBITaxon:9606" for *Homo sapiens*, this should be an HsapDv term. If organism_ontology_term_id is "NCBITaxon:10090" for *Mus musculus*, this should be an MmusDv term.

        **Requirements for data contributors adhering to GDPR or like standards**: HCA requests that you do not submit year-specific terms. Refer to broader age bracket terms as needed.
    comments:
      - Developmental stage is a key biological covariate for interpreting cell state and comparing samples across donors.

  sample_collection_method:
    title: Sample Collection Method
    description: The method the sample was physically obtained from the donor.
    examples:
      - value: biopsy
      - value: brush
      - value: surgical resection
    annotations:
      annDataLocation: obs
      tier: Tier 1
    range: SampleCollectionMethod
    required: true
    comments:
      - Main contributor to batch effects.

  tissue_ontology_term:
    is_a: deprecated_slot
    title: Tissue Ontology Term
    description: Deprecated placeholder for tissue ontology term.
    annotations:
      annDataLocation: obs

  disease_ontology_term:
    is_a: deprecated_slot
    title: Disease Ontology Term
    description: Deprecated placeholder for disease ontology term.
    annotations:
      annDataLocation: obs

  disease_ontology_term_id:
    title: Disease Ontology Term ID
    description: Disease, if expected to impact the sample.
    range: string
    required: true
    examples:
      - value: "MONDO:0005385"
      - value: "PATO:0000461"
    notes:
      - |-
        This must be a MONDO term or "PATO:0000461" for normal or healthy.

        **Requirements for data contributors adhering to GDPR or like standards**: In the case of disease, HCA requests that you submit a higher order ontology term - this is especially important in the case of rare disease.
    comments:
      - Disease has a major effect on cell state, and determines which samples can serve as a healthy reference.
    annotations:
      annDataLocation: obs
      cxg: disease_ontology_term_id
      tier: Tier 1